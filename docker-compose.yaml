services:
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=booking_system
    volumes:
      - ./setup-sql:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    container_name: booking_redis
    ports:
    - '6379:6379'
    